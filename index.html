        <h1>Khwahish Kushwah — Product Designer, UX Engineer & User Researcher</h1>
        <p>Berlin-based Product Designer and UX Engineer bridging behavioral research, accessible design systems (WCAG 2.2 AA), and frontend engineering in React and TypeScript. Specializing in cognitive interaction architecture, usability testing, and AI-assisted design workflows.</p>
        
        <h2>Featured Product Design & UX Case Studies</h2>
        <ul>
          <li><strong>Zellix: All-in-One CRM & HRMS Ecosystem</strong> (Fintech mobile application uniting property leads, team scheduling, and automated payroll)</li>
          <li><strong>KircheKeep: German Church Support Platform</strong> (Compliant, WCAG 2.2 AA accessible web portal for donations, tax payments, and volunteer coordination)</li>
          <li><strong>Dashly: Social Media Manager</strong> (Centralized multi-channel dashboard for video consumption and content scheduling)</li>
          <li><strong>Learnado: Comprehensive Learning Ecosystem</strong> (Cognitive flow-designed online education platform with modular course roadmaps)</li>
          <li><strong>Flyza: Airline Booking & Reservation Platform</strong> (Transparent, stress-free flight reservation funnel with modular seat selection)</li>
          <li><strong>Travel Nest: Integrated Travel & Booking Application</strong> (All-in-one flight and hotel reservation mobile application)</li>
          <li><strong>boAt Audio</strong> (Tactile companion app interface with intuitive soundstage tuning and device switching)</li>
          <li><strong>NeoBank Mobile</strong> (Modern digital banking experience with one-tap peer transfers and visual spending analytics)</li>
          <li><strong>Housing App</strong> (Exploratory property search experience with contextual map overlays and neighborhood insights)</li>
